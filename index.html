<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cat Encyclopedia</title>
</head>
<body>
    <div>
        
    </div>
    <audio id="audio" src="./assets/purr.wav" preload="auto" hidden></audio>
    <div id="navigate" class="head rounded">
        <a href="./index.html">The encyclopedia</a>
        <a href="./calculate.html">Calculate the age of my cat</a>
        <a href="./form.html">Show your cat</a>
    </div>
    <div id="carrousel" class="carrousel"></div>

    <!-- Modal Popup -->
    <div id="catModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img id="modalImage" src="" alt="">
            <h2 id="modalRace"></h2>
            <p id="modalOrigin"></p>
            <p id="modalDescription"></p>
        </div>
    </div>

    <!-- Cookie Banner -->
     <div id="cookie-banner" style="display: block;">
        Voulez-vous donner un cookie au pépites de chocolat pour aider les chats ?
        <button id="accept-cookies" onclick="acceptCookie()">Accepter</button>
        <button id="decline-cookies" onclick="declineCookie()">Refuser</button>
    </div>

    <script src="script.js"></script>
    <script>
        function declineCookie() {
            document.getElementById('cookie-banner').style.display = 'none';
        }

        function acceptCookie() {
            alert("Vous voulez tuer les chats ? Le chocolat tue les animaux !");
            document.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
        }
    </script>
</body>
</html>
