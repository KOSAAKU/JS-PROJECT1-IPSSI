<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Cat Encyclopedia - Show your cat</title>
</head>
<body>
    <div id="navigate" class="head rounded">
        <a href="./">The encyclopedia</a>
        <a href="./calculate.h<tml">Calculate the age of my cat</a>
        <a href="./form.html">Show your cat</a>
    </div>
    <div class="container">
        <form id="catForm" class="catForm">
            <h1>Show us your cat</h1>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="image">Image:</label><br>
            <input type="file" id="image" name="image" accept="image/png, image/jpeg" required><br><br>
            <label for="race">Race:</label><br>
            <input type="text" id="race" name="race" required><br><br>
            <label for="origin">Origin:</label><br>
            <input type="text" id="origin" name="origin" required><br><br>
            <label for="description">Description:</label><br>
            <textarea id="description" name="description" required></textarea><br><br>
            <input type="submit" value="Add Entry">
        </form>
    </div>
    <script src="./form.js"></script>
</body>
</html>
